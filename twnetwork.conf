# ==============================================================================
# Nginx VirtualHost Configuration — TW Network
# Project: twnetwork-site (Full-Stack React + Express + PostgreSQL)
# File: /etc/nginx/sites-available/twnetwork.conf (or /etc/nginx/conf.d/twnetwork.conf)
#
# Production reverse proxy template with:
# - HTTP to HTTPS permanent redirection (301)
# - Certbot / Let's Encrypt ACME challenge support
# - WebSocket upgrade mapping ($http_upgrade / $connection_upgrade)
# - Proxy headers (Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto)
# - 1-year immutable caching for /assets/ and /mc-icons/
# - Comprehensive Gzip compression (+ ready-to-enable Brotli block)
# - Hidden file blocking (.env, .git, etc.) with ACME challenge exception
# ==============================================================================

# 1. Connection Upgrade Mapping for WebSocket Support
# Maps $http_upgrade to $connection_upgrade to preserve standard HTTP keep-alive
# connections while upgrading WebSocket handshakes cleanly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. HTTP Server — Port 80
# Handles ACME challenges for Let's Encrypt / Certbot renewal and redirects
# all standard HTTP traffic to secure HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name twnetwork.com.br www.twnetwork.com.br;

    # ACME Challenge Directory for Let's Encrypt / Certbot renewal
    # Note: ^~ modifier ensures this block has higher priority than regex dotfile denial
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Block access to hidden files and directories on port 80
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Server — Port 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twnetwork.com.br www.twnetwork.com.br;

    # Root directory for static production build (Vite output: dist/)
    root /var/www/twnetwork-site/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # SSL / TLS Configuration (Certbot / Let's Encrypt Placeholders)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/twnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twnetwork.com.br/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/twnetwork.com.br/chain.pem;

    # Modern TLS Protocols and Mozilla Intermediate Cipher Suite
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (uncomment once certificates are issued)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 1.1.1.1 valid=300s;
    # resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Compression: Gzip & Brotli
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Brotli Compression (uncomment if ngx_brotli module is installed on Nginx)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/x-javascript
    #     application/xml
    #     application/xml+rss
    #     image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers & Limits
    # --------------------------------------------------------------------------
    client_max_body_size 20M;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Security: Block Hidden Files & Directories (.env, .git, .gitignore, etc.)
    # --------------------------------------------------------------------------
    # Allow ACME challenge first
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Deny all files starting with a dot
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching: /assets/ (Vite Hashed Bundles: JS, CSS)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @proxy;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching: /mc-icons/ (Minecraft Item Textures)
    # --------------------------------------------------------------------------
    location /mc-icons/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @proxy;
    }

    # --------------------------------------------------------------------------
    # Static Root Icons & Favicons
    # --------------------------------------------------------------------------
    location ~* \.(ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @proxy;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy: Application Backend & SPA Routing (Node.js on 127.0.0.1:3000)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Reverse Proxy Identification Headers
        # Crucial for Express `trust proxy: 1` and accurate rate-limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upstream timeouts and buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
